<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>בתנועה - ניהול סטודיו</title>
    <meta name="theme-color" content="#9c5389" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="בתנועה" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('betnua-theme');
          if (theme) document.documentElement.setAttribute('data-theme', theme);
          var scales = [0.875, 1, 1.125, 1.25, 1.375];
          var saved = localStorage.getItem('betnua-font-scale-index');
          var idx = saved === null ? scales.length - 1 : Number(saved);
          if (Number.isInteger(idx) && idx >= 0 && idx < scales.length) {
            document.documentElement.style.setProperty('--font-scale', String(scales[idx]));
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
